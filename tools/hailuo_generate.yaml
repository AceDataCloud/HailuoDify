identity:
  name: hailuo_generate_video
  author: acedatacloud
  label:
    en_US: Hailuo Generate Video
    zh_Hans: Hailuo 生成视频
description:
  human:
    en_US: Generate videos with Ace Data Cloud Hailuo Videos API.
    zh_Hans: 通过 Ace Data Cloud Hailuo Videos API 生成视频。
  llm: Generate videos with Ace Data Cloud Hailuo Videos API. For asynchronous results,
    preserve task_id and use the task retrieval tool until completion. A successful
    submission is not completed output.
parameters:
- name: model
  type: select
  required: false
  form: form
  label:
    en_US: Model
    zh_Hans: 模型
  human_description:
    en_US: Select a model currently supported by this API. Availability and pricing
      depend on the chosen model.
    zh_Hans: 用于生成视频的模型，默认值为 `minimax-t2v`。
  llm_description: Select a model currently supported by this API. Availability and
    pricing depend on the chosen model.
  default: minimax-t2v
  options:
  - value: minimax-i2v
    label:
      en_US: minimax-i2v
      zh_Hans: minimax-i2v
  - value: minimax-t2v
    label:
      en_US: minimax-t2v
      zh_Hans: minimax-t2v
  - value: minimax-i2v-director
    label:
      en_US: minimax-i2v-director
      zh_Hans: minimax-i2v-director
- name: action
  type: select
  required: false
  form: form
  label:
    en_US: Action
    zh_Hans: 行为
  human_description:
    en_US: Choose how to generate the video.
    zh_Hans: 视频生成的操作类型。设为 `generate` 时，将根据提示词生成视频。
  llm_description: Choose how to generate the video.
  default: generate
  options:
  - value: generate
    label:
      en_US: generate
      zh_Hans: generate
- name: prompt
  type: string
  required: false
  form: llm
  label:
    en_US: Prompt
    zh_Hans: 提示词
  human_description:
    en_US: Required prompt for video generation.
    zh_Hans: 用于生成视频的提示词。
  llm_description: Required prompt for video generation.
- name: callback_url
  type: string
  required: false
  form: form
  label:
    en_US: Callback Url
    zh_Hans: 回调 URL
  human_description:
    en_US: Set callback url for this operation.
    zh_Hans: 视频生成完成后将被调用的回调 URL。
  llm_description: Set callback url for this operation.
- name: first_image_url
  type: string
  required: false
  form: form
  label:
    en_US: First Image URL
    zh_Hans: 首帧图片链接
  human_description:
    en_US: Required for minimax-i2v.
    zh_Hans: 可指定首帧图片 URL，用于以图生视频。
  llm_description: Required for minimax-i2v.
output_schema:
  type: object
  properties:
    status:
      type: string
    success:
      type: boolean
    task_id:
      type: string
    trace_id:
      type: string
    media_urls:
      type: array
      items:
        type: string
    data: {}
    result:
      type: object
extra:
  python:
    source: tools/hailuo_generate.py
